name: Empaquetar skills verificadas
on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/package_plugin.py'
      - 'tests/**'
      - '.codex-plugin/plugin.json'
      - '.github/workflows/prueba-puente-plugin.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: paquete-skills-${{ github.ref }}
  cancel-in-progress: true
jobs:
  paquete:
    if: github.repository == 'vtsalamanca/gestor-de-skills'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas oficiales
        run: python3 -m unittest discover -s tests -p test_package_plugin.py
      - name: Leer version y empaquetar
        shell: bash
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')
          python3 scripts/package_plugin.py --repository . --commit "$GITHUB_SHA" --output "gestor-de-skills-${VERSION}-oficial.zip"
          sha256sum "gestor-de-skills-${VERSION}-oficial.zip" | tee paquete.sha256
      - name: Subir ZIP intacto
        uses: actions/upload-artifact@v7
        with:
          name: gestor-de-skills-oficial
          path: gestor-de-skills-*-oficial.zip
          archive: false
          retention-days: 1